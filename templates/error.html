{% extends "base.html" %}
{% block title %}{{ e.code }}{% endblock %}
{% block body %}
<h1>{{ {400:'Что-то не так',403:'Нельзя',404:'Не найдено'}.get(e.code, 'Ошибка') }}</h1>
<p class="muted">{{ e.description if e.code == 400 else '' }}</p>
<p><a href="{{ url_for('home') }}">На главную</a></p>
{% endblock %}
