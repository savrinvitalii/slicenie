{% extends "base.html" %}
{% block title %}Правка{% endblock %}
{% block body %}
<h1>Правка размышления</h1>
<blockquote class="quote small-q">{{ a.text }}</blockquote>
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <textarea name="body" rows="6" maxlength="4000" required>{{ c.body }}</textarea>
  <button class="btn">Сохранить</button>
</form>
{% endblock %}
